# Formatting first, then `nix flake check`, which runs everything the
# flake defines, all of it offline:
#
#   checks.pipeline    — the data pipeline's unit tests: .drv parsing, the
#                        reverse closure count, pool filtering, the
#                        multiverse join, the narinfo walk
#   checks.site-tests  — the game's unit tests, and the committed data
#                        drawn from in both pools
#   checks.site        — the deployable tree assembles: entry page, the
#                        hashed module directory and data file in place
#   checks.browser     — the built page in Chromium: what each revealed
#                        number does when clicked, a methods fragment,
#                        the pool choice, phone width
#
# data/game.json is committed, not regenerated here; docs/data.md says why.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Formatting
        run: nix fmt -- --ci

      - name: Tests
        run: nix flake check -L
